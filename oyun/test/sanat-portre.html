<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Sanat: bilim insanı portreleri</title>
<style>
:root{--bg:#0e0724;--panel:#1a0f3d;--ink:#fff;--muted:#c4b9ec}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:17px 'Trebuchet MS',system-ui,sans-serif}
h2{margin:12px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.c{background:var(--panel);border:2px solid #f4f0ff;border-radius:10px;padding:6px;text-align:center;width:196px}
.c svg{width:184px;height:184px;display:block;border-radius:8px}
.c b{display:block;font-size:14px;color:var(--muted)}
.s .c{width:84px}.s .c svg{width:78px;height:78px}
</style></head><body>
<h2>Büyük (detay paneli)</h2><div class="row" id="b"></div>
<h2>Küçük (78 px kart)</h2><div class="row s" id="s"></div>
<h2>Tanımsız id (varsayılan silüet)</h2><div class="row" id="d"></div>
<script src="../src/js/00-q.js"></script>
<script src="../src/js/41-art-portre.js"></script>
<script>
(function(){
function card(id,host){var d=document.createElement('div');d.className='c';d.innerHTML=Q.art.portre(id)+'<b>'+id+'</b>';document.getElementById(host).appendChild(d)}
Q.art.PORTRE_IDS.forEach(function(id){card(id,'b');card(id,'s')});
['xyz','bonus_1','bonus_2','bonus_3'].forEach(function(id){card(id,'d')});
})();
</script></body></html>
