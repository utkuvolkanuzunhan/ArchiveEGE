<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sim fotoelektrik</title>
<style>
:root{--bg:#0e0724;--panel:#1a0f3d;--ink:#ffffff;--muted:#c4b9ec;--yellow:#ffd23f;--cyan:#00e5ff;--magenta:#ff3df0;--lime:#39ff88;--sky:#120a30}
body{background:var(--bg);color:var(--ink);font-family:sans-serif;margin:16px}
#host{max-width:560px;background:var(--panel);padding:10px;border-radius:10px}
button{min-height:40px;margin:6px 6px 0 0}
</style></head><body>
<div id="host"></div>
<div><button id="bd">Başarıyı tetikle</button><button id="bs">set f=8 I=3</button><button id="bx">destroy</button></div>
<pre id="log"></pre>
<script>
window.Q={sim:{_m:{},register:function(m,i){Q.sim._m[m]=i;},mount:function(m,h,p,a){return Q.sim._m[m].mount(h,p,a);}}};
</script>
<script src="../src/js/70-sim-fotoelektrik.js"></script>
<script>
var log=document.getElementById('log'),h=document.getElementById('host');
window.__done=0;
var api={done:function(r){log.textContent+='done '+JSON.stringify(r)+'\n';window.__done++;},hint:function(t){window.__hint=t;}};
var s=Q.sim.mount('fotoelektrik',h,{f:3,I:5,metal:'Cs',basari:{esikAlti:true,siddet:10}},api);
document.getElementById('bd').onclick=function(){var r=h.querySelectorAll('input[type=range]');r[0].value=2;r[0].dispatchEvent(new Event('input'));r[1].value=10;r[1].dispatchEvent(new Event('input'));};
document.getElementById('bs').onclick=function(){s.set({f:8,I:3});};
document.getElementById('bx').onclick=function(){s.destroy();};
</script></body></html>
