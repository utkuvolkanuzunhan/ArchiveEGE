<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q.ui demo (A4)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="../src/styles/00-tokens.css">
<link rel="stylesheet" href="../src/styles/10-layout.css">
<link rel="stylesheet" href="../src/styles/20-components.css">
<link rel="stylesheet" href="../src/styles/30-runway-overlay.css">
</head><body>
<!-- SHELL-BAŞLANGIÇ: src/html/shell.html ile aynı (ui.test.js eşitliği doğrular) -->
<div id="app">
  <header id="topbar">
    <button id="btn-settings" type="button" aria-label="Ayarlar">⚙</button>
    <div id="hud-station"></div>
    <ol id="hud-path" aria-label="Engel şeridi"></ol>
    <div id="hud-voltaj"><span>Voltaj</span><div class="track"><i id="voltaj-bar"></i></div><b id="voltaj-n">100</b></div>
    <div id="hud-claude" title="Claude durumu"></div>
    <div id="hud-timer"></div>
  </header>
  <main id="runway">
    <!-- canvas buraya eklenir (A2) -->
    <div id="runway-overlay">
      <div id="boss-panel" hidden></div>
      <div id="bubble-layer"></div>
      <div id="dmg-layer"></div>
      <div id="stage-banner"></div>
    </div>
  </main>
  <section id="dock" aria-live="polite"></section>
  <div id="modal-layer" hidden></div>
  <div id="toast-layer"></div>
</div>
<!-- SHELL-BİTİŞ -->
<script src="../src/js/00-q.js"></script>
<script src="../src/js/10-state.js"></script>
<script src="../src/js/50-ui.js"></script>
<script>
(function(){
  'use strict';
  var Q = window.Q, ui = Q.ui;
  /* Demo: ?demo=confidence|options|textbox|thinking|modal|confirm|toast|hud|boss|hepsi */
  var demo = (location.search.match(/demo=(\w+)/) || [0, 'hepsi'])[1];
  ui.hud.setStation('Işık-test odası', 3, 9);
  ui.hud.setVoltaj(72); ui.hud.setTimer(4320); ui.hud.setClaude('sample');
  ui.hud.setPath([
    { tip: 'hikaye', durum: 'tamam' }, { tip: 'kavram', durum: 'tamam' }, { tip: 'dusman', durum: 'hata' },
    { tip: 'dusman', durum: 'simdi' }, { tip: 'tahmin', durum: 'bekliyor' }, { tip: 'tuzak', durum: 'bekliyor' },
    { tip: 'kopru', durum: 'bekliyor' }, { tip: 'patron', durum: 'bekliyor' }, { tip: 'sandik', durum: 'bekliyor' }
  ]);
  function sahne(){
    var host = ui.dock.mount(document.createElement('div'));
    ui.bubble.say({ kim: 'Çırak', metin: 'Bu kapı ne soruyor?', konum: 'runner', ms: 600000 });
    return host;
  }
  window.demoRun = {
    confidence: function(){ var h = sahne(); return ui.confidence.ask({ host: h }); },
    options: function(){
      var h = sahne();
      return ui.options.ask({ host: h, secenekler: [{ t: 'Elektron sayısı artar' }, { t: 'Elektron enerjisi artar' }, { t: 'Hiçbir şey olmaz' }] });
    },
    textbox: function(){ var h = sahne(); return ui.textbox.ask({ host: h, soru: 'Sıfır noktası enerjisi nereden gelir?', maks: 280 }); },
    thinking: function(){ var h = sahne(); ui.thinking.show(h, { metin: 'Canavar cevabını okuyor…' }); },
    modal: function(){ var b = document.createElement('p'); b.textContent = 'Oyun duraklatıldı.'; ui.modal.open(b, { baslik: 'Mola' }); },
    confirm: function(){ return ui.confirm({ metin: 'Tüm ilerleme silinir. Emin misin?', evet: 'Sil', hayir: 'Vazgeç' }); },
    toast: function(){ ui.toast('Doğru! Voltaj yükseldi.', { tur: 'iyi', ms: 600000 }); ui.toast('Tuzak buydu.', { tur: 'kotu', ms: 600000 }); ui.toast('KISA DEVRE!', { buyuk: true, ms: 600000 }); },
    boss: function(){
      var h = sahne();
      ui.boss.show({ id: 'einstein', ad: 'Foton Canavarı', kisa: 'Albert Einstein · 1905', soru: 'Işığı 10 kat parlattın. Kaç elektron kopar?' });
      ui.boss.setHp(80);
      ui.fx.damage('-24', { tur: 'verilen', x: 0.35, y: 0.5 });
      ui.fx.damage('KRİTİK!', { tur: 'kritik', x: 0.2, y: 0.3 });
      ui.fx.banner('PATRON!');
      ui.options.ask({ host: h, secenekler: [{ t: 'Hiç' }, { t: 'On kat' }, { t: 'Bir tane' }] });
    },
    kart: function(){
      var h = ui.dock.mount(document.createElement('div'));
      h.appendChild(ui.card({ id: 'planck', ad: 'Max Planck', yil: '1900', cumle: 'Enerji paket paket gelir.' }));
      h.appendChild(ui.card({ kilitli: true }));
    }
  };
  var fn = demo === 'hepsi' ? 'options' : demo;
  if (window.demoRun[fn]) window.demoRun[fn]();
})();
</script>
</body></html>
