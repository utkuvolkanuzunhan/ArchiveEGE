<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>sim bohr</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0e0724; --bg2:#1a0f3d; --panel:#1a0f3d; --panel2:#25164f;
  --ink:#ffffff; --ink-dark:#0b0620; --muted:#c4b9ec; --line:#f4f0ff;
  --yellow:#ffd23f; --cyan:#00e5ff; --magenta:#ff3df0; --lime:#39ff88; --red:#ff4d6d; --blue:#3a5bff;
  --accent:var(--yellow); --accent-ink:#0b0620; --sel:#0a3a52; --track:#0b0620;
  --font-d:'Lilita One','Impact',sans-serif; --font-b:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b)}
#host{max-width:640px;margin:16px;padding:12px;background:var(--panel)}
</style></head><body>
<div id="host"></div>
<div style="margin:16px"><button id="basari" type="button">Başarı tetikle (3→2)</button> <span id="log"></span></div>
<script src="../src/js/00-q.js"></script>
<script src="../src/js/70-sim-bohr.js"></script>
<script>
var api={done:function(o){document.getElementById('log').textContent='done '+JSON.stringify(o);window.__done=o;},hint:function(){}};
var host=document.getElementById('host');
var q=new URLSearchParams(location.search);
window.sim=Q.sim.mount('bohr',host,{n:+(q.get('n')||4),m:+(q.get('m')||2),basari:{gecis:[3,2]}},api);
document.getElementById('basari').onclick=function(){
  var s=host.querySelectorAll('select');
  s[0].value='3';s[0].dispatchEvent(new Event('change'));
  s[1].value='2';s[1].dispatchEvent(new Event('change'));
  [].slice.call(host.querySelectorAll('button')).filter(function(b){return b.textContent.indexOf('Photon')===0})[0].click();
};
</script></body></html>
