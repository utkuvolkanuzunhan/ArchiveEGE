<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Sanat: karakterler</title>
<style>
:root{--bg:#0e0724;--panel:#1a0f3d;--ink:#fff;--muted:#c4b9ec;--red:#ff4d6d;--font-d:'Lilita One',Impact,'Arial Black',sans-serif}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:17px 'Trebuchet MS',system-ui,sans-serif}
h2{margin:12px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.c{background:var(--panel);border:2px solid #f4f0ff;border-radius:10px;padding:6px;text-align:center}
.small .mon{width:92px;height:92px;display:block}
.big .mon{width:340px;height:340px;display:block}
.c b{display:block;font-size:14px;color:var(--muted)}
</style></head><body>
<h2>92 px</h2><div class="row small" id="s"></div>
<h2>340 px</h2><div class="row big" id="b"></div>
<h2>Duygu halleri (czoch, 92 px)</h2><div class="row small" id="d"></div>
<script src="../src/js/00-q.js"></script>
<script src="../src/js/40-art-chars.js"></script>
<script>
(function(){
var ids=Q.art.CHAR_IDS;
function card(id,fn,host){var d=document.createElement('div');d.className='c';d.innerHTML=fn(id)+'<b>'+id+'</b>';document.getElementById(host).appendChild(d)}
function mk(id){return Q.art[Q.art.CAMEO_IDS.indexOf(id)>=0?'cameo':'monster'](id)}
ids.forEach(function(id){card(id,mk,'s');card(id,mk,'b')});
['idle','konus','vuruldu','guldu'].forEach(function(h){card('czoch',function(id){return Q.art.monster(id,{durum:h,renk:'#ff3df0'})},'d')});
})();
</script></body></html>
