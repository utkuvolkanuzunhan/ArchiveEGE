<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S1 kristal_tur testi</title>
<style>:root{--bg:#0e0724;--bg2:#1a0f3d;--panel:#1a0f3d;--panel2:#25164f;--ink:#ffffff;--ink-dark:#0b0620;--muted:#c4b9ec;--line:#f4f0ff;--yellow:#ffd23f;--cyan:#00e5ff;--magenta:#ff3df0;--lime:#39ff88;--red:#ff4d6d;--blue:#3a5bff;--accent:var(--yellow);--accent2:var(--cyan);--accent-ink:#0b0620;--good:var(--lime);--bad:var(--red);--sel:#0a3a52;--sel-ink:#ffffff;--track:#0b0620;--bubble:#ffffff;--bubble-ink:#0b0620;--bubble-line:#0b0620;--bubble-shadow:#00e5ff;--bw:3px;--r:10px;--rs:8px;--shadow:6px 6px 0 var(--magenta);--shadow-sm:4px 4px 0 var(--ink-dark);--glow-cyan:0 0 14px rgba(0,229,255,.65);--glow-magenta:0 0 14px rgba(255,61,240,.6);--glow-lime:0 0 12px rgba(57,255,136,.6);--font-d:'Lilita One','Impact','Arial Black',sans-serif;--font-b:'Nunito','Trebuchet MS',system-ui,sans-serif;--fs-body:17px;--fs-small:14px;--sky:#120a30;--ground:#00e5ff;--grid:rgba(255,61,240,.22);--runner:#ffd23f;--foe:#ff3df0;--m-line:#0b0620;--m-line2:#0b0620;--m-lw:5;--m-lw2:3;--m-lws:3.5;--m-aura:rgba(0,229,255,.10);--m-auraline:#00e5ff;--m-dash:5 7;--m-ray:#ffd23f;--m-rayl:#0b0620;--m-body:#3a5bff;--m-collar:#ffffff;--m-hair:#f4f4f4;--m-skin:#ffc99b;--m-eye:#ffffff;--m-pupil:#0b0620;--m-mous:#9aa0ad;--m-mouth:#b3122a;--m-acc:#00e5ff;--m-label:#ffffff;color-scheme:dark}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:var(--fs-body)}
#host{max-width:640px;margin:0 auto 12px}#log{font-size:var(--fs-small);color:var(--muted);max-width:640px;margin:8px auto}
.t{min-height:40px;margin:4px 4px 0 0;padding:0 12px}</style></head><body>
<div id="host"></div>
<div style="max-width:640px;margin:0 auto"><button class="t" id="b-tur">mod: tur</button><button class="t" id="b-yol">mod: serbest_yol</button><button class="t" id="b-basari">basari tetikle</button><button class="t" id="b-dest">destroy</button></div>
<div id="log"></div>
<script>
/* küçük Q.sim sahtesi (gerçek 00-q.js beklenmez) */
window.Q=window.Q||{sim:{}};
Q.sim._m={};Q.sim.register=function(n,i){Q.sim._m[n]=i;};Q.sim.mount=function(n,h,p,a){return Q.sim._m[n].mount(h,p,a);};
</script>
<script src="../src/js/70-sim-kristal_tur.js"></script>
<script>
var q=new URLSearchParams(location.search);
var params={mod:q.get("mod")||"tur",gonder:q.get("gonder")==="1",basari:q.get("b")==="kiyas"?{kiyas:true}:{hepsiniDene:true}};
var logEl=document.getElementById("log"),sim;
window.doneLog=[];
function api(){return {done:function(s){window.doneLog.push(s);logEl.textContent="done: "+JSON.stringify(s);},hint:function(t){window.hintText=t;}};}
sim=Q.sim.mount("kristal_tur",document.getElementById("host"),params,api());
document.getElementById("b-tur").onclick=function(){sim.set({mod:"tur"});};
document.getElementById("b-yol").onclick=function(){sim.set({mod:"serbest_yol"});};
document.getElementById("b-basari").onclick=function(){logEl.textContent=JSON.stringify(sim.getState());};
document.getElementById("b-dest").onclick=function(){sim.destroy();};
</script></body></html>
