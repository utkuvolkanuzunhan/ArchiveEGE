<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>sim czochralski</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0e0724; --bg2:#1a0f3d; --panel:#1a0f3d; --panel2:#25164f;
  --ink:#ffffff; --ink-dark:#0b0620; --muted:#c4b9ec; --line:#f4f0ff;
  --yellow:#ffd23f; --cyan:#00e5ff; --magenta:#ff3df0; --lime:#39ff88; --red:#ff4d6d; --blue:#3a5bff;
  --accent:var(--yellow); --accent-ink:#0b0620; --sel:#0a3a52; --track:#0b0620;
  --font-d:'Lilita One','Impact',sans-serif; --font-b:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b)}
#host{max-width:640px;margin:16px;padding:12px;background:var(--panel)}
</style></head><body>
<div id="host"></div>
<div style="margin:16px"><button id="basari" type="button">Başarı tetikle (v=0.6, 15 rpm)</button> <span id="log"></span></div>
<script src="../src/js/00-q.js"></script>
<script src="../src/js/70-sim-czochralski.js"></script>
<script>
var api={done:function(o){document.getElementById('log').textContent='done '+JSON.stringify(o);window.__done=o;},hint:function(){}};
var host=document.getElementById('host');
var sp=new URLSearchParams(location.search);
window.sim=Q.sim.mount('czochralski',host,{v:+(sp.get('v')||1.5),rpm:+(sp.get('rpm')||5),basari:{tekKristal:true}},api);
document.getElementById('basari').onclick=function(){
  sim.set({v:0.6,rpm:15});
  setTimeout(function(){[].slice.call(host.querySelectorAll('button')).filter(function(b){return b.textContent==='Çek'})[0].click();},1200);
};
</script></body></html>
