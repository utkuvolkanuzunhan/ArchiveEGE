  Q.obs.register('kavram', {
    tip: 'kavram',
    async enter(ob, ctx){
      var simObj = null, timers = [];
      function temizle(){
        timers.forEach(function(t){ clearTimeout(t); });
        timers = [];
        if (simObj && typeof simObj.destroy === 'function') safe(function(){ simObj.destroy(); });
        simObj = null;
      }
      try {
        var host = ctx.host;
        host.textContent = '';
        var sure = ctx.sureler || (Q.obs && Q.obs.sureler) || {};
        var tIpucu = sure.ipucu != null ? sure.ipucu : 45000;
        var tGec = sure.gec != null ? sure.gec : 120000;

        var gorev = U.el('p', 'kavram-gorev'); gorev.textContent = ob.gorev || '';
        var simHost = U.el('div', 'kavram-sim');
        var hintLine = U.el('p', 'kavram-ipucu'); hintLine.hidden = true;
        var butonlar = U.el('div', 'kavram-butonlar');
        host.appendChild(gorev); host.appendChild(simHost);
        host.appendChild(hintLine); host.appendChild(butonlar);

        var sonHint = '', acildi = false, kapandi = false, bitir;
        var bitisSozu = new Promise(function(res){ bitir = res; });
        var api = {
          done: function(){ if (acildi || kapandi) return; acildi = true; bitir('done'); },
          hint: function(m){ if (typeof m === 'string' && m) sonHint = m; },
          onFail: function(){}
        };
        simObj = Q.sim.mount(ob.sim && ob.sim.modul, simHost, ob.sim && ob.sim.params, api);

        var ipBtn = btn('İpucu'); ipBtn.hidden = true;
        var gecBtn = btn('Geç'); gecBtn.hidden = true;
        butonlar.appendChild(ipBtn); butonlar.appendChild(gecBtn);
        ipBtn.addEventListener('click', function(){
          hintLine.textContent = sonHint || 'Kontrolleri dene, kapı tepki verir.';
          hintLine.hidden = false;
        });
        gecBtn.addEventListener('click', function(){
          if (acildi || kapandi) return;
          kapandi = true; bitir('gec');
        });
        timers.push(setTimeout(function(){ ipBtn.hidden = false; }, tIpucu));
        timers.push(setTimeout(function(){ gecBtn.hidden = false; }, tGec));

        var how = await bitisSozu;
        kapandi = true;
        temizle();
        butonlar.textContent = ''; hintLine.hidden = true;

        var gecti = how === 'gec';
        if (!gecti) await run(ctx, 'anim', 'kapi-ac');
        var ogr = U.el('p', 'kavram-ogrenilen');
        ogr.textContent = (gecti ? 'Geçtin, konu defterde kalır. ' : '') + (ob.ogrenilen || '');
        host.appendChild(ogr);
        await devam(host);

        return { dogru: !gecti, eminlik: gecti ? 0 : 1, kavram: ob.kavram || null,
                 agirlik: ob.agirlik || 1, notlar: gecti ? 'gecildi' : '' };
      } catch (e) {
        console.error('obs-kavram', e);
        temizle();
        safe(function(){ Q.ui.toast('Kapıda bir aksilik oldu.', { tur: 'kotu' }); });
        return { dogru: false, eminlik: 1, kavram: null, agirlik: (ob && ob.agirlik) || 1, notlar: 'hata' };
      }
    }
  });
})();

/* 80-obs-kopru.js (H4) Engel isleyicisi: kirik kopru (mantik zincirini siraya dizme).
 * Ekledigi alan: Q.obs.handlers.kopru (Q.obs.register ile). Karti pointer olaylariyla surukle-birak
 * VEYA dokun-siraya-ekle (klavye dahil); yuvaya dokunmak geri alir. Eminlik sorulmaz.
 * Bagimlilik: 00-q.js, 01 §3.5/§5.1; Q.ui.toast, Q.battle.tamirModu (varsa) kullanilir.
 */
(function(){
  'use strict';
  var Q = window.Q;

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function shuffle(n){
    var a = [], i, j, t;
    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    var same = true;
    for (i = 0; i < n; i++) if (a[i] !== i) same = false;
    if (same && n > 1) { t = a[0]; a[0] = a[1]; a[1] = t; }
    return a;
  }

  function safeAnim(ctx, name){
    try {
      if (ctx && ctx.runway && ctx.runway.anim) return Promise.resolve(ctx.runway.anim(name, {})).catch(function(){});
    } catch (e) {}
    return Promise.resolve();
  }

  function tamir(ctx){
    try { return !!(Q.battle && Q.battle.tamirModu && Q.battle.tamirModu(ctx.stationId)); } catch (e) { return false; }
  }

  function run(ob, ctx){
    return new Promise(function(resolve){
      var host = ctx.host;
      var blocks = ob.bloklar || [];
      var n = blocks.length;
      var slots = [];            // yuva i -> blok indeksi | null
      var order = shuffle(n);    // havuz sirasi (blok indeksleri)
      var locked = false;
      var lastTapAt = 0;
      var drag = null;
      var devamBtn = null, sonuc = null;
      var i;
      for (i = 0; i < n; i++) slots.push(null);

      var root = el('div', 'kopru');
      root.style.cssText = 'display:flex;flex-direction:column;gap:10px;';
      var head = el('div', 'kopru-soru', ob.soru || 'Zinciri sıraya diz');
      head.style.cssText = 'font-family:var(--font-d);font-size:20px;';
      var poolBox = el('div', 'kopru-havuz');
      poolBox.setAttribute('aria-label', 'Kartlar');
      poolBox.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;min-height:48px;';
      var slotBox = el('ol', 'kopru-yuvalar');
      slotBox.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;';
      var bar = el('div', 'kopru-bar');
      bar.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;';
      var kontrol = el('button', 'btn primary kopru-kontrol', 'Kontrol');
      kontrol.type = 'button';
      kontrol.disabled = true;
      bar.appendChild(kontrol);
      var msg = el('div', 'kopru-mesaj');
      msg.setAttribute('aria-live', 'polite');
      msg.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
      root.appendChild(head);
      root.appendChild(poolBox);
      root.appendChild(slotBox);
      if (tamir(ctx)) {
        var ip = el('div', 'kopru-ipucu', ob.ipucu || 'Soruyu yeniden oku');
        ip.style.cssText = 'color:var(--muted);font-size:var(--fs-small);';
        root.appendChild(ip);
      }
      root.appendChild(bar);
      root.appendChild(msg);
      host.appendChild(root);

      var cardEls = [];  // blok indeksi -> buton
      var slotEls = [];  // yuva indeksi -> buton

      for (i = 0; i < n; i++) {
        var c = el('button', 'opt kopru-kart', blocks[i]);
        c.type = 'button';
        c.setAttribute('data-blok', String(i));
        c.style.touchAction = 'none';
        c.style.cursor = 'grab';
        c.style.userSelect = 'none';
        cardEls[i] = c;
      }

      for (i = 0; i < n; i++) {
        var li = el('li', 'kopru-yuva-sira');
        li.style.cssText = 'display:flex;align-items:stretch;gap:8px;';
        var no = el('b', 'kopru-no', String(i + 1));
        no.style.cssText = 'min-width:28px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);';
        var s = el('button', 'kopru-yuva');
        s.type = 'button';
        s.setAttribute('data-yuva', String(i));
        s.style.cssText = 'flex:1;min-height:44px;text-align:left;padding:4px;border:2px dashed var(--line);border-radius:var(--rs);background:transparent;color:var(--ink);font:inherit;font-size:var(--fs-body);cursor:pointer;';
        s.setAttribute('aria-label', 'Yuva ' + (i + 1) + ', boş');
        li.appendChild(no);
        li.appendChild(s);
        slotBox.appendChild(li);
        slotEls[i] = s;
      }

      function render(){
        var used = {}, k;
        for (k = 0; k < n; k++) if (slots[k] != null) used[slots[k]] = true;
        while (poolBox.firstChild) poolBox.removeChild(poolBox.firstChild);
        order.forEach(function(b){ if (!used[b]) poolBox.appendChild(cardEls[b]); });
        for (k = 0; k < n; k++) {
          var sl = slotEls[k];
          while (sl.firstChild) sl.removeChild(sl.firstChild);
          if (slots[k] != null) {
            sl.appendChild(cardEls[slots[k]]);
            sl.style.borderStyle = 'solid';
            sl.setAttribute('aria-label', 'Yuva ' + (k + 1) + ': ' + blocks[slots[k]] + ' (geri almak için dokun)');
          } else {
            sl.style.borderStyle = 'dashed';
            sl.setAttribute('aria-label', 'Yuva ' + (k + 1) + ', boş');
          }
        }
        var full = slots.every(function(v){ return v != null; });
        kontrol.disabled = locked || !full;
      }

      function firstEmpty(){
        for (var k = 0; k < n; k++) if (slots[k] == null) return k;
        return -1;
      }
      function slotOf(b){ return slots.indexOf(b); }

      function place(b, target){
        if (locked) return;
        var from = slotOf(b);
        if (from >= 0) slots[from] = null;
        if (target == null || target < 0) target = firstEmpty();
        if (target < 0) { render(); return; }
        var prev = slots[target];
        slots[target] = b;
        if (prev != null && from >= 0) slots[from] = prev; // yer değiştir
        render();
      }
      function unplace(k){
        if (locked || slots[k] == null) return;
        slots[k] = null;
        render();
      }

      /* ---- pointer ile surukle-birak / dokunma ---- */
      function onDown(e){
        if (locked) return;
        var cd = e.target && e.target.closest ? e.target.closest('.kopru-kart') : null;
        if (!cd || !root.contains(cd)) return;
        if (e.button != null && e.button > 0) return;
        drag = { b: +cd.getAttribute('data-blok'), x: e.clientX, y: e.clientY, moved: false, ghost: null, id: e.pointerId, card: cd };
        try { cd.setPointerCapture(e.pointerId); } catch (x) {}
      }
      function onMove(e){
        if (!drag || e.pointerId !== drag.id) return;
        var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (!drag.moved && Math.sqrt(dx * dx + dy * dy) > 6) {
          drag.moved = true;
          var r = drag.card.getBoundingClientRect();
          var g = drag.card.cloneNode(true);
          g.style.cssText += ';position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;margin:0;z-index:9999;pointer-events:none;opacity:.92;box-shadow:var(--shadow-sm);';
          g.setAttribute('aria-hidden', 'true');
          document.body.appendChild(g);
          drag.ghost = g; drag.ox = r.left; drag.oy = r.top;
          drag.card.style.opacity = '.35';
        }
        if (drag.moved && drag.ghost) {
          drag.ghost.style.left = (drag.ox + dx) + 'px';
          drag.ghost.style.top = (drag.oy + dy) + 'px';
        }
      }
      function endDrag(e, cancel){
        if (!drag || (e && e.pointerId !== drag.id)) return;
        var d = drag; drag = null;
        try { d.card.releasePointerCapture(d.id); } catch (x) {}
        d.card.style.opacity = '';
        if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
        if (cancel) return;
        lastTapAt = Date.now();
        var cur = slotOf(d.b);
        if (!d.moved) {                // dokun-yerlestir / geri al
          if (cur >= 0) unplace(cur); else place(d.b, -1);
          return;
        }
        var under = document.elementFromPoint(e.clientX, e.clientY);
        var sl = under && under.closest ? under.closest('.kopru-yuva') : null;
        if (sl && slotBox.contains(sl)) place(d.b, +sl.getAttribute('data-yuva'));
        else if (under && poolBox.contains(under) && cur >= 0) unplace(cur);
      }
      function onUp(e){ endDrag(e, false); }
      function onCancel(e){ endDrag(e, true); }

      /* ---- klavye (click detail 0) ve yuva dokunusu ---- */
      function onClick(e){
        if (locked) return;
        var t = e.target;
        var cd = t.closest ? t.closest('.kopru-kart') : null;
        if (cd) {
          if (e.detail === 0) {          // klavye: Enter/Bosluk
            var b = +cd.getAttribute('data-blok');
            var cur = slotOf(b);
            if (cur >= 0) unplace(cur); else place(b, -1);
          }
          return;                        // pointer ile zaten islendi
        }
        var sl = t.closest ? t.closest('.kopru-yuva') : null;
        if (sl && Date.now() - lastTapAt > 40) unplace(+sl.getAttribute('data-yuva'));
      }
      function onKey(e){
        if (e.key === 'Enter' && devamBtn && !e.repeat) {
          e.preventDefault();
          devamBtn.click();
        }
      }
      root.addEventListener('pointerdown', onDown);
      root.addEventListener('pointermove', onMove);
      root.addEventListener('pointerup', onUp);
      root.addEventListener('pointercancel', onCancel);
      root.addEventListener('click', onClick);
      document.addEventListener('keydown', onKey);

      function finish(){
        root.removeEventListener('pointerdown', onDown);
        root.removeEventListener('pointermove', onMove);
        root.removeEventListener('pointerup', onUp);
        root.removeEventListener('pointercancel', onCancel);
        root.removeEventListener('click', onClick);
        document.removeEventListener('keydown', onKey);
        if (drag && drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
        resolve(sonuc);
      }

      function showDevam(){
        var b = el('button', 'btn primary kopru-devam', 'Devam');
        b.style.alignSelf = 'flex-start';
        b.type = 'button';
        b.addEventListener('click', function(){
          if (devamBtn !== b) return;
          devamBtn = null;
          b.disabled = true;
          finish();
        });
        devamBtn = b;
        msg.appendChild(b);
        try { b.focus(); } catch (x) {}
      }

      kontrol.addEventListener('click', function(){
        if (locked || kontrol.disabled) return;
        locked = true;
        kontrol.disabled = true;
        var wrong = [], k;
        for (k = 0; k < n; k++) if (slots[k] !== k) wrong.push(k);
        var dogru = wrong.length === 0;
        sonuc = { dogru: dogru, eminlik: 1, kavram: ob.kavram || null, agirlik: ob.agirlik || 1, notlar: ob.sonuc || '' };
        for (k = 0; k < n; k++) { cardEls[k].style.cursor = 'default'; cardEls[k].disabled = true; }
        if (dogru) {
          slotEls.forEach(function(sl){ sl.style.borderColor = 'var(--good)'; });
          var ok = el('div', 'kopru-dogru', ob.sonuc || '');
          ok.style.cssText = 'border:3px solid var(--good);border-radius:var(--rs);padding:8px 12px;';
          msg.appendChild(ok);
          safeAnim(ctx, 'kopru-kur').then(showDevam);
        } else {
          wrong.forEach(function(w){
            var sl = slotEls[w];
            sl.style.borderColor = 'var(--bad)';
            sl.style.borderStyle = 'solid';
            sl.classList.add('kopru-yanlis');
            try { sl.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}], { duration: 450 }); } catch (x) {}
          });
          var yz = el('div', 'kopru-duzeltme');
          yz.style.cssText = 'border:3px solid var(--good);border-radius:var(--rs);padding:8px 12px;';
          yz.appendChild(el('b', null, 'Yanlış. Doğru sıra:'));
          var ol = el('ol', 'kopru-dogru-sira');
          ol.style.cssText = 'margin:4px 0 0;padding-left:22px;';
          blocks.forEach(function(t){ ol.appendChild(el('li', null, t)); });
          yz.appendChild(ol);
          msg.appendChild(yz);
          if (ob.sonuc) msg.appendChild(el('div', 'kopru-sonuc', ob.sonuc));
          safeAnim(ctx, 'sendele').then(showDevam);
        }
      });

      render();
    });
  }

  Q.obs.register('kopru', {
    tip: 'kopru',
    enter: function(ob, ctx){
      var p;
      try { p = run(ob || {}, ctx); } catch (e) { p = Promise.reject(e); }
      return p.catch(function(){
        try { if (Q.ui && Q.ui.toast) Q.ui.toast('Köprü kurulamadı.', { tur: 'kotu' }); } catch (e) {}
        return { dogru: false, eminlik: 1, kavram: null, agirlik: (ob && ob.agirlik) || 1, notlar: 'hata' };
      });
    }
  });
})();

/* 80-obs-sandik.js (H1) "sandik" engeli: bilim insanı kartı, yeni makine, özet, kontrol noktası.
 * Ekler: Q.obs.handlers.sandik. Yazar: Q.state.kartlar, Q.state.fabrika.kurulu; çağırır Q.save.write.
 * Bağımlılık: 00-q.js, 10-state.js. Hasar uygulamaz; asla reject etmez. */
(function(){
  'use strict';
  var Q = window.Q;

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function box(){
    var d = el('div', 'sd-kutu');
    d.style.cssText = 'background:var(--panel2);color:var(--ink);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:8px 12px;font-size:var(--fs-body);opacity:0;transition:opacity .4s;';
    return d;
  }
  function goster(d){ void d.offsetWidth; d.style.opacity = '1'; }
  function cap(s){ s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

  async function enter(ob, ctx){
    try {
      try { await ctx.runway.anim('zafer'); } catch (e) {}
      var st = ctx.state || Q.state;
      var ist = ctx.istasyon || {};
      var host = ctx.host;
      host.textContent = '';
      var wrap = el('div', 'sd-sahne');
      wrap.style.cssText = 'display:flex;flex-direction:column;gap:8px;padding:10px 16px;';
      host.appendChild(wrap);

      /* 1. Kart */
      var kart = ob.kart || {};
      var k1 = box();
      k1.style.display = 'flex'; k1.style.gap = '14px'; k1.style.alignItems = 'center';
      var pt = el('div', 'sd-portre');
      pt.style.cssText = 'flex:0 0 auto;width:96px;height:96px;';
      try {
        if (kart.id && Q.art && typeof Q.art.cameo === 'function') pt.innerHTML = Q.art.cameo(kart.id, { cls: 'sd-cameo' }) || ''; /* güvenilir SVG */
      } catch (e) {}
      k1.appendChild(pt);
      var kt = el('div', 'sd-kart');
      var ad = el('div', 'sd-kart-ad', cap(kart.id) + ' · ' + (kart.yil != null ? kart.yil : ''));
      ad.style.cssText = 'font-family:var(--font-d);font-size:22px;color:var(--accent);';
      kt.appendChild(ad);
      kt.appendChild(el('div', 'sd-kart-cumle', kart.tekCumle || ''));
      k1.appendChild(kt);
      wrap.appendChild(k1); goster(k1);
      if (kart.id && st.kartlar && st.kartlar.indexOf(kart.id) < 0) st.kartlar.push(kart.id);
      await sleep(600);

      /* 2. Fabrika */
      var k2 = box();
      k2.className += ' sd-fabrika';
      k2.style.borderColor = ist.renk || 'var(--accent2)';
      k2.appendChild(el('span', '', 'Yeni makine kuruldu: '));
      var mk = el('b', 'sd-makine', ist.makine || ist.ad || '');
      mk.style.color = 'var(--accent)';
      k2.appendChild(mk);
      wrap.appendChild(k2); goster(k2);
      var sid = ctx.stationId || ist.id;
      if (sid && st.fabrika && st.fabrika.kurulu.indexOf(sid) < 0) st.fabrika.kurulu.push(sid);
      await sleep(600);

      /* 3. Özet */
      var ozet = (ob.ozet || []).slice(0, 3);
      var ul = el('ul', 'sd-ozet');
      ul.style.cssText = 'margin:0;padding-left:22px;font-size:var(--fs-body);';
      wrap.appendChild(ul);
      for (var i = 0; i < ozet.length; i++) {
        var li = el('li', '', ozet[i]);
        li.style.cssText = 'opacity:0;transition:opacity .4s;';
        ul.appendChild(li); goster(li);
        await sleep(500);
      }

      /* 4. Kontrol noktası */
      var alt = el('div', 'sd-alt');
      alt.style.cssText = 'display:flex;gap:12px;align-items:center;margin-top:4px;';
      var rozet = el('span', 'sd-rozet', 'Kayıt alındı');
      rozet.style.cssText = 'font-weight:800;color:var(--ink-dark);background:var(--good);border:var(--bw) solid var(--ink-dark);border-radius:var(--rs);padding:2px 12px;box-shadow:var(--glow-lime);';
      alt.appendChild(rozet);
      try { if (Q.save && Q.save.write) Q.save.write(); } catch (e) {}
      wrap.appendChild(alt);

      await new Promise(function(res){
        var b = el('button', 'sd-devam', 'Devam');
        b.type = 'button';
        b.style.cssText = 'font-family:var(--font-d);font-size:20px;background:var(--accent);color:var(--accent-ink);border:var(--bw) solid var(--ink-dark);border-radius:var(--rs);padding:8px 22px;box-shadow:var(--shadow-sm);cursor:pointer;';
        function onEnter(e){ if (e.key === 'Enter') { e.preventDefault(); bitir(); } }
        function bitir(){ document.removeEventListener('keydown', onEnter); res(); }
        b.addEventListener('click', bitir);
        document.addEventListener('keydown', onEnter);
        alt.appendChild(b);
        b.focus();
      });
      return { dogru: true, eminlik: 1, kavram: null, agirlik: 1 };
    } catch (err) {
      try { if (Q.ui && Q.ui.toast) Q.ui.toast('Sandık açılamadı, devam ediyoruz', { tur: 'kotu' }); } catch (e) {}
      return { dogru: false, eminlik: 1, kavram: null, agirlik: (ob && ob.agirlik) || 1, notlar: 'hata' };
    }
  }

  Q.obs.register('sandik', { tip: 'sandik', enter: enter });
})();

/* 80-obs-tahmin.js (H3) Engel işleyicisi: "tahmin" (tahmin çukuru).
 * Akış: soru + 3 seçenek, eminlik, simülasyon önceki -> sonraki (set), atla/dus animasyonu, açıklama, Devam.
 * Ekler: Q.obs.handlers.tahmin. Bekleme ctx.sureler.tahminBekle (ms, varsayılan 1500) ile kısaltılabilir.
 * Bağımlılık: 00-q.js (Q.util, Q.sim, Q.obs); çalışma anında ctx.ui (options, confidence), Q.battle.tamirModu. */
(function(){
  'use strict';
  var U = Q.util;

  function safe(fn){ try { return fn(); } catch (e) { console.error('obs-tahmin', e); } }
  function run(ctx, name){
    var a = Array.prototype.slice.call(arguments, 2);
    try {
      var r = ctx && ctx.runway && ctx.runway[name] ? ctx.runway[name].apply(ctx.runway, a) : null;
      return Promise.resolve(r).catch(function(){});
    } catch (e) { return Promise.resolve(); }
  }
  function devam(host){
    return new Promise(function(res){
      var b = U.el('button', 'btn primary'), t0 = Date.now(), bitti = false;
      b.type = 'button'; b.textContent = 'Devam';
      function bit(){
        if (bitti) return; bitti = true;
        document.removeEventListener('keydown', key, true);
        res();
      }
      function key(e){
        if (e.key === 'Enter' && Date.now() - t0 > 250) { e.preventDefault(); bit(); }
      }
      b.addEventListener('click', bit);
      document.addEventListener('keydown', key, true);
      host.appendChild(b);
      try { b.focus(); } catch (e) {}
    });
  }
  /* sayısal parametreleri yaklaşık 0.9 sn'de ara değerlerle sonrakine taşır; değilse tek set() */
  async function gecis(simObj, onceki, sonraki){
    if (!simObj || typeof simObj.set !== 'function' || !sonraki) return;
    var keys = Object.keys(sonraki);
    var sayisal = keys.length > 0 && keys.every(function(k){
      return typeof sonraki[k] === 'number' && onceki && typeof onceki[k] === 'number';
    });
    if (!sayisal || U.reduceMotion()) { safe(function(){ simObj.set(sonraki); }); return; }
    var adim = 12;
    for (var i = 1; i <= adim; i++) {
      var p = {}, f = i / adim;
      keys.forEach(function(k){ p[k] = onceki[k] + (sonraki[k] - onceki[k]) * f; });
      safe(function(){ simObj.set(p); });
      await U.sleep(75);
    }
  }

  Q.obs.register('tahmin', {
    tip: 'tahmin',
    async enter(ob, ctx){
      var simObj = null;
      try {
        var host = ctx.host;
        host.textContent = '';
        var sure = ctx.sureler || (Q.obs && Q.obs.sureler) || {};
        var bekle = sure.tahminBekle != null ? sure.tahminBekle : 1500;

        var soru = U.el('p', 'tahmin-soru'); soru.textContent = ob.soru || '';
        var opsHost = U.el('div', 'tahmin-secenek');
        var ipucu = U.el('p', 'tahmin-ipucu');
        host.appendChild(soru); host.appendChild(opsHost); host.appendChild(ipucu);
        var tamir = false;
        safe(function(){ tamir = !!Q.battle.tamirModu(ctx.stationId); });
        if (tamir) ipucu.textContent = ob.ipucu || 'Soruyu yeniden oku';

        var ui = ctx.ui || Q.ui;
        var idx = await ui.options.ask({
          host: opsHost, tek: true,
          secenekler: ob.secenekler.map(function(s){ return { t: s.t }; })
        });
        var secili = ob.secenekler[idx];
        var dogru = !!(secili && secili.dogru);
        var dIdx = 0;
        ob.secenekler.forEach(function(s, i){ if (s.dogru) dIdx = i; });

        host.textContent = '';
        host.appendChild(soru);
        var eminHost = U.el('div', 'tahmin-eminlik'); host.appendChild(eminHost);
        var em = await ui.confidence.ask({ host: eminHost });

        host.textContent = '';
        var simHost = U.el('div', 'tahmin-sim');
        var sonucSatiri = U.el('p', 'tahmin-sonuc');
        sonucSatiri.textContent = 'Doğrulayalım...';
        host.appendChild(simHost); host.appendChild(sonucSatiri);
        simObj = Q.sim.mount(ob.sim && ob.sim.modul, simHost, ob.sim && ob.sim.onceki, {
          done: function(){}, hint: function(){}, onFail: function(){}
        });
        await U.sleep(bekle);
        await gecis(simObj, ob.sim && ob.sim.onceki, ob.sim && ob.sim.sonraki);

        sonucSatiri.className = 'tahmin-acik ' + (dogru ? 'dogru' : 'yanlis');
        sonucSatiri.textContent = dogru
          ? 'Doğru tahmin. ' + (ob.acik || '')
          : 'Yanlış. Doğrusu: ' + ob.secenekler[dIdx].t + '. ' + (ob.acik || '');
        await run(ctx, 'anim', dogru ? 'atla' : 'dus');
        await devam(host);

        return { dogru: dogru, eminlik: em, kavram: ob.kavram || null,
                 agirlik: ob.agirlik || 1.5, notlar: ob.acik || '' };
      } catch (e) {
        console.error('obs-tahmin', e);
        safe(function(){ Q.ui.toast('Çukurda bir aksilik oldu.', { tur: 'kotu' }); });
        return { dogru: false, eminlik: 1, kavram: null, agirlik: (ob && ob.agirlik) || 1, notlar: 'hata' };
      } finally {
        if (simObj && typeof simObj.destroy === 'function') safe(function(){ simObj.destroy(); });
      }
    }
  });
})();

/* 80-obs-tuzak.js (H2) `tuzak` engel işleyicisi: yanlış iddia 3 parçada, hatalı
 * parçayı bul, eminlik, düzeltme + Devam. Hasarı uygulamaz (runner uygular).
 * Ekler: Q.obs.register('tuzak'). Bağımlılık: 00-q.js, Q.ui (confidence, toast),
 * Q.battle.tamirModu (isteğe bağlı), ctx.runway. */
(function(){
  'use strict';
  var Q = window.Q;

  function mk(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function safe(fn){ try { return fn(); } catch (e) { return undefined; } }
  function waitContinue(host){
    return new Promise(function(res){
      var b = mk('button', 'btn primary', 'Devam');
      b.type = 'button';
      var done = false;
      function fin(){
        if (done) return; done = true;
        document.removeEventListener('keydown', onKey);
        res();
      }
      function onKey(e){ if (e.key === 'Enter') { e.preventDefault(); fin(); } }
      b.addEventListener('click', fin);
      document.addEventListener('keydown', onKey);
      host.appendChild(b);
      try { b.focus(); } catch (e) {}
    });
  }

  Q.obs.register('tuzak', {
    tip: 'tuzak',
    async enter(ob, ctx){
      try {
        var host = ctx.host, runway = ctx.runway || {};
        var parcalar = ob.parcalar || [];
        if (runway.setObstacleState) safe(function(){ runway.setObstacleState('aktif'); });
        if (runway.say) safe(function(){ runway.say('anlatici', ob.iddia); });

        if (ob.iddia) host.appendChild(mk('div', 'dusman-soru', ob.iddia));
        host.appendChild(mk('div', 'tuzak-talimat', 'Hatalı parçaya dokun.'));
        var cumle = mk('div', 'tuzak-cumle');
        cumle.setAttribute('role', 'group');
        host.appendChild(cumle);

        var btns = [];
        var secim = await new Promise(function(res){
          var kilit = false;
          function onKey(e){
            var n = parseInt(e.key, 10);
            if (n >= 1 && n <= btns.length) btns[n - 1].click();
          }
          parcalar.forEach(function(p, i){
            var b = mk('button', 'opt tuzak-parca', p);
            b.type = 'button';
            b.setAttribute('aria-pressed', 'false');
            b.addEventListener('click', function(){
              if (kilit) return; kilit = true;
              b.setAttribute('aria-pressed', 'true');
              btns.forEach(function(x){ x.disabled = true; });
              document.removeEventListener('keydown', onKey);
              res(i);
            });
            btns.push(b);
            cumle.appendChild(b);
          });
          document.addEventListener('keydown', onKey);
          if (btns[0]) { try { btns[0].focus(); } catch (e) {} }
        });

        var tamir = !!(Q.battle && Q.battle.tamirModu && safe(function(){ return Q.battle.tamirModu(ctx.stationId); }));
        if (tamir) host.appendChild(mk('div', 'tamir-ipucu', ob.ipucu || 'Soruyu yeniden oku'));

        var confHost = mk('div', 'tuzak-emin');
        host.appendChild(confHost);
        var em = await ctx.ui.confidence.ask({ host: confHost });
        var dogru = (secim === ob.yanlisParca);

        if (btns[ob.yanlisParca]) btns[ob.yanlisParca].classList.add('vurgu');
        if (dogru) {
          if (runway.anim) safe(function(){ runway.anim('tuzak-boz'); });
          host.appendChild(mk('div', 'aciklama iyi', 'Doğru. Düzeltilmiş hali: ' + ob.duzeltme));
        } else {
          if (runway.anim) safe(function(){ runway.anim('sendele'); });
          host.appendChild(mk('div', 'aciklama kotu',
            'Yanlış. Seçtiğin parça hatalı değil. Hatalı olan vurgulanan parça. Doğrusu: ' + ob.duzeltme));
        }
        await waitContinue(host);
        return { dogru: dogru, eminlik: em, kavram: ob.kavram || null,
                 agirlik: ob.agirlik || 1, notlar: 'tuzak' };
      } catch (err) {
        safe(function(){ Q.ui.toast('Bir şeyler ters gitti, devam ediyoruz', { tur: 'kotu' }); });
        return { dogru: false, eminlik: 1, kavram: null, agirlik: (ob && ob.agirlik) || 1, notlar: 'hata' };
      }
    }
  });
})();

/* 85-obs-patron.js (H5) Engel işleyicisi: `patron` (3 fazlı patron savaşı, ikinci şans, Claude puanlama).
 * Ekler: Q.obs.register('patron', ...). Hasarı bu işleyici uygular (Q.battle.apply, her denemede).
 * Bağımlılık: 00-q.js, Q.ui (A4), Q.claude (A6), Q.battle (A3), ctx.runway (A2), Q.art (A5, canavar duygu sınıfları).
 * Seçmeli ve açık fazlar; Claude yoksa yedekSecmeli. Şartname: oyun/09 H5, 03 §4, 04 §6. */
(function(){
  'use strict';
  var HP_FAZ = 40;

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function btn(text, primary){
    var b = el('button', 'btn' + (primary ? ' primary' : ''), text);
    b.type = 'button';
    return b;
  }
  function sleep(ms){
    return (Q.util && Q.util.sleep) ? Q.util.sleep(ms) : new Promise(function(r){ setTimeout(r, ms); });
  }
  function swallow(p){ try { if (p && p.catch) p.catch(function(){}); } catch (e) {} return p; }

  /* items: [{t, deger, primary, cls}]. enterValue tanımlıysa Enter o değeri seçer. */
  function waitButtons(area, items, enterValue){
    return new Promise(function(resolve){
      var row = el('div', 'p5-row');
      row.style.cssText = 'display:flex;gap:10px;margin-top:10px;flex-wrap:wrap';
      var done = false;
      function fin(v){
        if (done) return;
        done = true;
        document.removeEventListener('keydown', onKey, true);
        if (row.parentNode) row.parentNode.removeChild(row);
        resolve(v);
      }
      function onKey(e){
        if (e.key === 'Enter' && enterValue !== undefined) { e.preventDefault(); e.stopPropagation(); fin(enterValue); }
      }
      items.forEach(function(it){
        var b = btn(it.t, it.primary);
        if (it.cls) b.className += ' ' + it.cls;
        b.addEventListener('click', function(){ fin(it.deger); });
        row.appendChild(b);
      });
      area.appendChild(row);
      document.addEventListener('keydown', onKey, true);
      var first = row.querySelector('button');
      if (first && first.focus) { try { first.focus(); } catch (e) {} }
    });
  }
  function waitContinue(area){
    return waitButtons(area, [{ t: 'Devam', primary: true, deger: true, cls: 'devam' }], true);
  }
  function box(text, tur){
    var b = el('div', 'p5-box ' + tur, text);
    b.style.cssText = 'margin-top:8px;padding:8px 12px;border:2px solid var(' + (tur === 'iyi' ? '--good' : '--bad') +
      ');border-radius:var(--rs)';
    return b;
  }
  function hint(area, text){
    var h = el('div', 'p5-ipucu', text);
    h.style.cssText = 'margin:6px 0;font-size:var(--fs-small);color:var(--muted)';
    area.appendChild(h);
  }

  async function handle(ob, ctx){
    var host = ctx.host, runway = ctx.runway, ui = ctx.ui || Q.ui, claude = ctx.claude || Q.claude, battle = ctx.battle || Q.battle;
    var istasyon = ctx.istasyon || {};
    var tamir = false;
    try { tamir = !!(battle.tamirModu && battle.tamirModu(ctx.stationId)); } catch (e) {}
    var sonEminlik = 1, kisaDevre = false;

    /* ---- yardımcılar ---- */
    function mood(m){
      try {
        var p = document.getElementById('boss-panel');
        var mon = p && (p.querySelector('.mon') || p.querySelector('svg'));
        if (!mon) return;
        ['idle', 'konus', 'vuruldu', 'guldu', 'dusunuyor'].forEach(function(c){ mon.classList.remove(c); });
        mon.classList.add(m);
      } catch (e) {}
    }
    function say(metin){ mood('konus'); swallow(runway.say(ob.canavar, metin)); }
    function newArea(){
      host.textContent = '';
      var a = el('div', 'p5-area');
      host.appendChild(a);
      return a;
    }
    function head(area, i, n, no){
      var h = el('div', 'p5-head');
      h.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px';
      h.appendChild(el('span', 'chip', 'Faz ' + (i + 1) + '/' + n));
      if (no === 2) h.appendChild(el('span', 'chip', 'İkinci şans'));
      if (tamir) h.appendChild(el('span', 'chip', 'Tamir modu'));
      area.appendChild(h);
    }
    function kavramOf(faz, ek){ return faz.kavram || ob.kavram || ek || null; }
    function sonucOf(r){
      return { dogru: r.dogru, eminlik: r.eminlik, dogruluk: r.dogruluk == null ? null : r.dogruluk,
               kavram: r.kavram || null, agirlik: 2, notlar: r.notlar || '' };
    }
    /* Sonucu uygula + görsel geri bildirim */
    function uygula(sonuc){
      var t = null;
      try { t = battle.damageTable(sonuc.dogru, sonuc.eminlik, sonuc.agirlik); } catch (e) {}
      try { battle.apply(sonuc); } catch (e) { console.error('patron:apply', e); }
      if (t) {
        if (sonuc.dogru !== false && t.verilen) swallow(runway.damageNumber(t.verilen, t.kritik ? 'kritik' : 'verilen'));
        if (t.alinan) swallow(runway.damageNumber(t.alinan, 'alinan'));
      }
      mood(sonuc.dogru === false ? 'guldu' : 'vuruldu');
      if (Q.state && Q.state.voltaj <= 0) kisaDevre = true;
    }
    function bossHit(){
      try {
        if (battle.bossHit) battle.bossHit(HP_FAZ);
        else if (Q.state && Q.state.aktif) {
          var h = Q.state.aktif.bossHp;
          Q.state.aktif.bossHp = Math.max(0, (h == null ? 120 : h) - HP_FAZ);
          Q.bus.emit('boss:hp', { hp: Q.state.aktif.bossHp });
        }
      } catch (e) { console.error('patron:bossHit', e); }
    }

    /* ---- seçmeli bir soru sunar (eminlik dahil), seçilen/doğru seçeneği döndürür ---- */
    async function secmeliSor(area, secenekler, faz, eminlikSor, eminlikHazir){
      var kutu = el('div', 'p5-opts');
      area.appendChild(kutu);
      if (tamir) hint(area, ob.ipucu || faz.ipucu || 'Soruyu yeniden oku');
      var idx = await ui.options.ask({ host: kutu, secenekler: secenekler.map(function(s){ return { t: s.t }; }), tek: true });
      var em = eminlikSor ? await ui.confidence.ask({ host: area }) : eminlikHazir;
      sonEminlik = em;
      var secilen = secenekler[idx] || {}, dogruSec = null;
      secenekler.forEach(function(s){ if (s.dogru) dogruSec = s; });
      return { dogru: !!secilen.dogru, eminlik: em, dogruluk: null, kavram: kavramOf(faz), agirlik: 2,
               notlar: secilen.neden || '', secilen: secilen, dogruSecenek: dogruSec };
    }
    async function secmeliAciklama(area, r){
      area.textContent = '';
      var neden = (r.secilen && r.secilen.neden) || '';
      if (r.dogru) {
        area.appendChild(box((r.eminlik === 0 ? 'İçgüdün iyi. Gerekçe: ' : 'Doğru. ') + neden, 'iyi'));
      } else {
        area.appendChild(box('Yanlış. ' + ((r.dogruSecenek && r.dogruSecenek.neden) || ''), 'kotu'));
        if (neden) hint(area, 'Seçtiğin: ' + neden);
      }
      await waitContinue(area);
    }

    /* ---- açık uçlu: cevap, eminlik, Claude. {kind:'bos'|'yedek'|'puan'} döndürür ---- */
    async function acikSor(area, soruMetni, faz, no){
      var cevap = '', jsonHata = 0;
      if (faz.pdfSoru && no === 1) {
        var d = el('details', 'p5-pdf');
        d.appendChild(el('summary', null, 'Sınav sorusu'));
        d.appendChild(el('div', null, faz.pdfSoru));
        area.appendChild(d);
      }
      for (;;) {
        var it = el('div', 'p5-iter');
        area.appendChild(it);
        var tb = el('div', 'p5-tb');
        it.appendChild(tb);
        var v = await ui.textbox.ask({ host: tb, soru: 'Cevabını yaz', maks: 280, deger: cevap });
        if (v == null || !String(v).trim() || /^\s*bilmiyorum\s*\.?\s*$/i.test(String(v))) {
          sonEminlik = 0;
          return { kind: 'bos', dogru: false, eminlik: 0, dogruluk: 0,
                   kavram: kavramOf(faz, faz.yanlisKavramIds && faz.yanlisKavramIds[0]) };
        }
        cevap = String(v);
        var em = await ui.confidence.ask({ host: it });
        sonEminlik = em;
        var iptal = false;
        while (!iptal) {
          var av = null;
          try { av = await claude.available(); } catch (e) { av = { backend: 'none' }; }
          if (!av || av.backend === 'none') return { kind: 'yedek', eminlik: em };
          var th = el('div', 'p5-th');
          it.appendChild(th);
          mood('dusunuyor');
          swallow(runway.say(ob.canavar, '…'));
          ui.thinking.show(th, { metin: 'Canavar cevabını okuyor…' });
          var puan = null, hata = null;
          try {
            puan = await claude.grade({ soru: soruMetni, anahtarFikirler: faz.anahtarFikirler || [],
              yanlisKavramlar: faz.yanlisKavramlar || [], idealCevap: faz.idealCevap || '', cevap: cevap, eminlik: em });
          } catch (e) { hata = e || {}; }
          try { ui.thinking.hide(); } catch (e) {}
          if (th.parentNode) th.parentNode.removeChild(th);
          mood('idle');
          if (puan) {
            var dr = +puan.dogruluk || 0, kv = null;
            if (puan.yanlisKavram && faz.yanlisKavramIds && faz.yanlisKavramIds.length) kv = faz.yanlisKavramIds[0];
            return { kind: 'puan', puan: puan, dogru: dr >= 70 ? true : dr >= 40 ? 'kismen' : false,
                     eminlik: em, dogruluk: dr, kavram: kavramOf(faz, kv) };
          }
          var code = hata.code || 'gecici';
          if (code === 'iptal') { iptal = true; break; }          /* cevap kutusuna dön, metin korunur */
          if (code === 'izin_yok' || code === 'yok') {
            try { ui.toast('Claude kapalı, çoktan seçmeliye geçtik', { tur: 'bilgi' }); } catch (e) {}
            return { kind: 'yedek', eminlik: em };
          }
          if (code === 'json' && ++jsonHata >= 2) return { kind: 'yedek', eminlik: em };
          var m = el('div', 'p5-hata', code === 'sinir' ? 'Biraz bekle, Claude yoruldu.' : 'Bağlantı sorunu.');
          it.appendChild(m);
          var sec = await waitButtons(it, [{ t: 'Tekrar dene', primary: true, deger: 'tekrar' }, { t: 'Yedek soruya geç', deger: 'yedek' }]);
          if (m.parentNode) m.parentNode.removeChild(m);
          if (sec === 'yedek') return { kind: 'yedek', eminlik: em };
        }
        if (it.parentNode) it.parentNode.removeChild(it);
      }
    }
    async function puanGoster(area, r){
      area.textContent = '';
      var p = r.puan;
      area.appendChild(el('div', 'p5-puan', 'Doğruluk: %' + r.dogruluk +
        (r.dogru === true ? ' · Tamam' : r.dogru === 'kismen' ? ' · Kısmen' : ' · Olmadı')));
      var ul = el('ul', 'p5-fikirler');
      ul.style.cssText = 'margin:6px 0;padding-left:0;list-style:none';
      (p.fikirler || []).forEach(function(f){
        ul.appendChild(el('li', f.var ? 'iyi' : 'kotu', (f.var ? '✓ ' : '✗ ') + f.fikir));
      });
      area.appendChild(ul);
      (p.geriBildirim || []).forEach(function(g){ area.appendChild(el('div', 'p5-gb', g)); });
      if (p.yanlisKavram) area.appendChild(box(p.yanlisKavram, 'kotu'));
      await waitContinue(area);
    }

    /* ---- bir deneme (no: 1 ya da 2) ---- */
    async function deneme(faz, i, n, no){
      var area = newArea();
      head(area, i, n, no);
      var alt = faz.alt || {}, r;
      if (faz.tip === 'secmeli') {
        say(no === 2 && alt.soru ? alt.soru : faz.soru);
        r = await secmeliSor(area, no === 2 && alt.secenekler ? alt.secenekler : faz.secenekler, faz, true);
        uygula(sonucOf(r));
        await secmeliAciklama(area, r);
        return r;
      }
      var sm = no === 2 && alt.soru ? alt.soru : faz.soru;
      say(sm);
      var a = await acikSor(area, sm, faz, no);
      if (a.kind === 'bos') {
        a.notlar = 'bilmiyorum';
        uygula(sonucOf(a));
        area.textContent = '';
        area.appendChild(box('Yanlış. ' + (faz.idealCevap || ''), 'kotu'));
        await waitContinue(area);
        return a;
      }
      if (a.kind === 'yedek') {
        var y = faz.yedekSecmeli;
        if (!y) { r = { dogru: false, eminlik: a.eminlik, kavram: kavramOf(faz), notlar: 'yedek yok' }; uygula(sonucOf(r)); return r; }
        area.textContent = '';
        head(area, i, n, no);
        say(y.soru);
        hint(area, 'Claude yok, çoktan seçmeli soru:');
        r = await secmeliSor(area, y.secenekler, faz, false, a.eminlik);
        uygula(sonucOf(r));
        await secmeliAciklama(area, r);
        return r;
      }
      a.notlar = (a.puan.geriBildirim && a.puan.geriBildirim[0]) || '';
      uygula(sonucOf(a));
      await puanGoster(area, a);
      return a;
    }

    /* ---- akış ---- */
    try {
      await runway.showBoss(ob.canavar, { ad: ob.canavarAd, renk: istasyon.renk });
      mood('idle');
      await runway.say(ob.canavar, ob.giris);
      if (battle.bossStart) battle.bossStart(ob.canavar);
      var fazlar = ob.fazlar || [];
      for (var i = 0; i < fazlar.length; i++) {
        var r1 = await deneme(fazlar[i], i, fazlar.length, 1);
        if (kisaDevre) break;
        if (r1.dogru === false) {
          await deneme(fazlar[i], i, fazlar.length, 2);
          if (kisaDevre) break;
        }
        bossHit();     /* doğru, kısmen ya da iki deneme de yanlış: HP yine 40 düşer */
        host.textContent = '';
        await sleep(200);
      }
      if (kisaDevre) {
        try { await runway.hideBoss(); } catch (e) {}
        host.textContent = '';
        return { dogru: false, kisaDevre: true, eminlik: sonEminlik, dogruluk: null, kavram: null, agirlik: 2, notlar: 'patron' };
      }
      await runway.anim('zafer');
      await runway.hideBoss();
      host.textContent = '';
      return { dogru: true, eminlik: sonEminlik, dogruluk: null, kavram: null, agirlik: 2, notlar: 'patron' };
    } catch (e) {
      console.error('patron', e);
      try { ui.toast('Patron sahnesinde bir aksilik oldu', { tur: 'kotu' }); } catch (e2) {}
      try { await runway.hideBoss(); } catch (e3) {}
      return { dogru: false, eminlik: 1, kavram: null, agirlik: ob.agirlik || 1, notlar: 'hata' };
    }
  }

  Q.obs.register('patron', {
    tip: 'patron',
    enter: function(ob, ctx){
      return handle(ob, ctx).catch(function(e){
        console.error('patron', e);
        return { dogru: false, eminlik: 1, kavram: null, agirlik: (ob && ob.agirlik) || 1, notlar: 'hata' };
      });
    }

/* 95-runner-b.js (A2) Koşu motoru yardımcıları: sahte çizim (Q.art yoksa), yol üstü DOM katmanları
 * (patron paneli, balon, hasar sayısı, duraklatma menüsü), parçacık çizimi.
 * Ekler: Q.runner._b. Bağımlılık: 00-q.js. 95-runner.js bunu yalnızca çalışma anında çağırır. */
(function(){
  'use strict';
  var B = Q.runner._b = {};

  function cssVar(name, fb){
    try {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name);
      return (v && v.trim()) || fb;
    } catch (e) { return fb; }
  }
  B.cssVar = cssVar;

  /* ---------- sahte çizim ---------- */
  B.fakeWorld = function(ctx, camX, t, renk, W, H, groundY){
    ctx.fillStyle = cssVar('--sky', '#120a30'); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = cssVar('--bg2', '#1a0f3d'); ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = renk || cssVar('--ground', '#00e5ff'); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.strokeStyle = cssVar('--grid', 'rgba(255,61,240,.22)'); ctx.lineWidth = 2;
    var off = -((camX % 120) + 120) % 120;
    for (var x = off; x < W; x += 120) { ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x - 60, H); ctx.stroke(); }
  };
  B.fakeRunner = function(ctx, x, y, durum, t){
    var hop = 0;
    if (durum === 'atla') hop = Math.abs(Math.sin(t * 5)) * 120;
    if (durum === 'zafer') hop = Math.abs(Math.sin(t * 6)) * 40;
    var tilt = durum === 'sendele' ? Math.sin(t * 30) * 6 : 0;
    var dy = durum === 'dus' ? 60 : 0;
    ctx.fillStyle = cssVar('--runner', '#ffd23f');
    ctx.fillRect(x - 30 + tilt, y - 110 - hop + dy, 60, 110);
    ctx.fillStyle = cssVar('--ink-dark', '#0b0620');
    ctx.fillRect(x + 8 + tilt, y - 95 - hop + dy, 12, 12);
  };
  B.fakeObstacle = function(ctx, tip, x, y, durum, t, opts){
    var h = tip === 'patron' ? 260 : tip === 'tahmin' ? 20 : 150, w = 100;
    var col = opts && opts.renk || cssVar('--foe', '#ff3df0');
    if (durum === 'cozuldu') col = cssVar('--good', '#39ff88');
    if (durum === 'basarisiz') col = cssVar('--bad', '#ff4d6d');
    ctx.fillStyle = col;
    ctx.globalAlpha = durum === 'cozuldu' ? 0.45 : 1;
    ctx.fillRect(x - w / 2, y - h, w, h);
    ctx.globalAlpha = 1;
    ctx.fillStyle = cssVar('--ink', '#fff'); ctx.font = '22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(tip, x, y - h - 10);
  };

  /* ---------- parçacıklar ---------- */
  B.drawParticles = function(ctx, list, gt){
    list.forEach(function(p){
      var k = Math.min(1, (gt - p.t0) / p.sure);
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(p.x, p.y - k * 40);
      if (p.tur === 'bam') {
        ctx.fillStyle = cssVar('--yellow', '#ffd23f'); ctx.font = 'bold ' + Math.round(48 + 30 * k) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.fillText('BAM!', 0, 0);
      } else {
        ctx.fillStyle = cssVar('--cyan', '#00e5ff');
        for (var i = 0; i < 6; i++) { var a = i * 1.05 + p.t0; ctx.fillRect(Math.cos(a) * 50 * k, Math.sin(a) * 50 * k, 8, 8); }
      }
      ctx.restore();
    });
  };

  /* ---------- DOM katmanları ---------- */
  function layer(runway, id){
    var e = document.getElementById(id);
    if (e && runway.contains(e)) return e;
    e = document.createElement('div'); e.id = id;
    e.style.cssText = 'position:absolute;inset:0;pointer-events:none;';
    runway.appendChild(e); return e;
  }
  B.showBoss = function(runway, charId, opts){
    var p = document.getElementById('boss-panel');
    if (!p || !runway.contains(p)) {
      p = document.createElement('div'); p.id = 'boss-panel';
      p.style.cssText = 'position:absolute;right:0;top:0;bottom:0;width:34%;pointer-events:none;';
      runway.appendChild(p);
    }
    var svg = '';
    try { if (Q.art && Q.art.monster) svg = Q.art.monster(charId, { cls: (opts && opts.cls) || 'boss-svg' }) || ''; } catch (e) { console.error('boss', e); }
    p.innerHTML = svg || '';   // güvenilir sanat çıktısı, kullanıcı girdisi değil
    if (!svg) p.textContent = String(charId);
    p.hidden = false;
    var rm = Q.util.reduceMotion();
    p.style.transition = rm ? 'none' : 'transform 1.7s cubic-bezier(.2,.7,.3,1)';
    p.style.transform = rm ? 'none' : 'translateX(105%)';
    void p.offsetWidth;
    p.style.transform = 'translateX(0)';
    return Q.util.sleep(1700);
  };
  B.hideBoss = function(){
    var p = document.getElementById('boss-panel');
    if (!p) return Promise.resolve();
    var rm = Q.util.reduceMotion();
    p.style.transition = rm ? 'none' : 'transform 1s ease-in';
    p.style.transform = 'translateX(105%)';
    return Q.util.sleep(1000).then(function(){ p.hidden = true; p.innerHTML = ''; });
  };
  B.say = function(runway, kim, metin, opts){
    opts = opts || {};
    var konum = opts.konum || ((kim === 'runner' || kim === 'kosucu') ? 'runner' : (kim === 'selin' || kim === 'anlatici') ? 'anlatici' : 'canavar');

      if (h && !ay.hikayeAtla) list.push(Object.assign({}, h, { satirlar: (h.satirlar || []).slice(0, 1) }));
      src.forEach(function(o){ if (o.tip === 'patron' || o.tip === 'sandik') list.push(o); });
      return list;
    }
    list = src.filter(function(o){ return !(ay.hikayeAtla && o.tip === 'hikaye'); });

      var kc = 0; Object.keys(cp).forEach(function(k){ if (+k <= from && +k > kc) kc = +k; });
      var p = prog(r); p.kontrol = kc; p.denendi = true;
      r.camX = Math.max(0, items.length ? items[from].x - 1200 : 0);
      if (from > 0) { items.forEach(function(it, j){ if (j < from) it.durum = 'cozuldu'; }); r.camX = Math.max(0, items[from].x - 1000 - rx()); }
      Q.state.aktif = { stationId: stationId, index: from };
      r.mode = 'run';
      paused = false; last = null;
      if (!rafId) rafId = requestAnimationFrame(tick);
      try {
        if (Q.ui && Q.ui.hud) {
          if (Q.ui.hud.setStation) Q.ui.hud.setStation(st.ad, st.sira, Object.keys(Q.data.stations).length || 10);
        }
      } catch (e) { console.error(e); }
      hudPath(r);
      Q.bus.emit('station:start', { stationId: stationId, fromIndex: from });
      endRun = function(sonuc){
        endRun = null;
        if (closeMenu) { closeMenu(); closeMenu = null; }
        paused = false;
        try { B().hideBoss(); } catch (e) { console.error(e); }
        Q.bus.emit('station:end', { stationId: stationId, sonuc: sonuc });
        if (run === r) run = null;
        resolve(sonuc);
      };
      orchestrate(r).then(function(s){
        if (r.aborted) return;
        if (s === 'tamam') { save(); }
        if (endRun) endRun(s);
      }, function(e){ console.error('runner', e); toast('Koşu durdu', 'kotu'); if (endRun) endRun('cikis'); });
    });
  };
  R.pause = function(){ if (run && !closeMenu) openPauseMenu(); };
  R.resume = function(){
    if (closeMenu) { closeMenu(); closeMenu = null; }
    paused = false; last = null;
  };
  R.jumpTo = function(index){
    var r = run;
    if (!r || r.mode !== 'run' || index < 0 || index >= r.items.length) return false;
    r.items.forEach(function(it, j){ it.durum = j < index ? 'cozuldu' : 'idle'; it.anim = null; });
    r.cur = index; r.camX = Math.max(0, r.items[index].x - 1000 - rx()); hudPath(r);
    return true;
  };
  R.info = function(){
    var r = run;
    return { aktif: !!r, mode: r && r.mode, camX: r && r.camX, cur: r && r.cur, W: W, runnerX: rx(), paused: paused,
      gt: r && r.gt, durumlar: r && r.items.map(function(i){ return i.durum; }), decelLog: decelLog.slice() };
  };
  R.canvas = null;

  document.addEventListener('keydown', onKey);
  document.addEventListener('visibilitychange', onVis);
})();

/* 99-main.js (A9) — başlatma ve istasyon akışı.
 * Ekler: Q.main {init, hosGeldin, startStation, dogrulaIstasyon, tumTamam}.
 * Akış: save.load -> claude.available (arka plan) -> hoş geldin -> harita -> runner.start -> harita.
 * Q.runner.start sarılır: veri doğrulama + süre sayacı + bitişte haritayı yeniden açma burada olur.
 * Bağımlı: 00-q, 10-state, 20-settings, 30-claude, 50-ui, 95-runner (hepsi çalışma anında çağrılır). */
(function () {
  'use strict';

  var SIRA = ['hikaye', 'kavram', 'dusman', 'dusman', 'tahmin', 'tuzak', 'kopru', 'patron', 'sandik'];
  var TOPLAM = 9;
  var finalBasladi = false;
  var timerId = null;
  var sarildi = false;

  function ids() {
    var a = [];
    for (var i = 1; i <= TOPLAM; i++) a.push('s' + (i < 10 ? '0' : '') + i);
    return a;
  }

  function tumTamam() {
    var il = (Q.state && Q.state.ilerleme) || {};
    return ids().every(function (id) { return il[id] && il[id].tamam; });
  }

  // Hafif çalışma-anı doğrulama; tam doğrulama test/veri-dogrula.js içinde. Hata varsa liste döner.
  function dogrulaIstasyon(st) {
    var hata = [];
    if (!st) return ['istasyon verisi yok'];
    var eng = st.engeller || [];
    if (eng.length !== SIRA.length) hata.push('engel sayısı ' + eng.length + ' (beklenen ' + SIRA.length + ')');
    eng.forEach(function (e, i) {
      if (SIRA[i] && e.tip !== SIRA[i]) hata.push('engel ' + (i + 1) + ' tipi ' + e.tip + ' (beklenen ' + SIRA[i] + ')');
      if ((e.tip === 'dusman' || e.tip === 'tahmin') && (!e.secenekler || e.secenekler.length !== 3 ||
        e.secenekler.filter(function (s) { return s.dogru; }).length !== 1)) hata.push('engel ' + (i + 1) + ' seçenekleri');
    });
    return hata;
  }

  function butonlar(liste) {
    var kap = Q.util.el('div', 'btnrow');
    kap.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px';
    liste.forEach(function (b) {
      var d = Q.util.el('button', 'btn' + (b.birincil ? ' primary' : ''));
      d.type = 'button';
      d.textContent = b.ad;
      d.addEventListener('click', b.fn);
      kap.appendChild(d);
    });
    return kap;
  }

  function haritaAc() {
    try { Q.ui.modal.close(); } catch (e) { /* modal yok */ }
    if (Q.settings && Q.settings.openMap) Q.settings.openMap();
  }

  function hosGeldin() {
    var devamVar = Object.keys((Q.state && Q.state.ilerleme) || {}).length > 0;
    var kutu = Q.util.el('div', 'hosgeldin');
    kutu.style.textAlign = 'center';
    var h = Q.util.el('h2');
    h.textContent = 'Çip Hattı';
    h.style.margin = '0 0 8px';
    var p = Q.util.el('p');
    p.textContent = 'Kumdan çipe: 9 istasyon, engelleri geç.';
    kutu.appendChild(h);
    kutu.appendChild(p);
    kutu.appendChild(butonlar([
      { ad: devamVar ? 'Devam' : 'Başla', birincil: true, fn: haritaAc },
      { ad: 'Ayarlar', fn: function () { if (Q.settings && Q.settings.open) Q.settings.open(); } }
    ]));
    if (Q.ui && Q.ui.modal) Q.ui.modal.open(kutu, { baslik: '' });
    else haritaAc();
  }

  function sayaci() {
    if (!Q.state.sure) Q.state.sure = { toplamSn: 0, oturumBaslangic: 0 };
    Q.state.sure.oturumBaslangic = Date.now();
    var sonKayit = 0;
    function tik() {
      if (document.hidden) return;
      Q.state.sure.toplamSn++;
      try { if (Q.ui && Q.ui.hud && Q.ui.hud.setTimer) Q.ui.hud.setTimer(Q.state.sure.toplamSn); } catch (e) { /* hud yok */ }
      if (++sonKayit >= 15) { sonKayit = 0; if (Q.save && Q.save.write) Q.save.write(); }
    }
    function dur() { if (timerId) { clearInterval(timerId); timerId = null; } }
    function basla() { if (!timerId) timerId = setInterval(tik, 1000); }
    document.addEventListener('visibilitychange', function () { if (document.hidden) dur(); else basla(); });
    if (!document.hidden) basla();
  }

  function final() {
    if (Q.final && typeof Q.final.start === 'function') return Q.final.start();
    if (Q.ui && Q.ui.toast) Q.ui.toast('Final yakında: Sınav Günü hazırlanıyor.', { tur: 'bilgi', ms: 4000 });
    return Promise.resolve();
  }

  function sarRunner() {
    if (sarildi || !Q.runner || typeof Q.runner.start !== 'function') return;
    sarildi = true;
    var orijinal = Q.runner.start;
    Q.runner.start = function (stationId, fromIndex) {
      var st = Q.data && Q.data.stations && Q.data.stations[stationId];
      var hata = dogrulaIstasyon(st);
      if (hata.length) {
        console.error('Veri doğrulama (' + stationId + '): ' + hata.join('; '));
        if (Q.ui && Q.ui.toast) Q.ui.toast('Bu istasyonun verisinde sorun var; yine de deniyoruz.', { tur: 'kotu', ms: 3500 });
      }
      var p;
      try { p = Promise.resolve(orijinal.call(Q.runner, stationId, fromIndex || 0)); }
      catch (e) { console.error(e); p = Promise.resolve('cikis'); }
      return p.then(function (sonuc) {
        if (sonuc === 'tamam' && tumTamam() && !finalBasladi) {
          finalBasladi = true;
          return Promise.resolve(final()).then(function () { haritaAc(); return sonuc; });
        }
        haritaAc();
        return sonuc;
      }, function (e) { console.error(e); haritaAc(); return 'cikis'; });
    };
  }

  function startStation(stationId, fromIndex) {
    return Q.runner.start(stationId, fromIndex || 0);
  }

  function init() {
    if (Q.save && Q.save.load) Q.save.load();
    sarRunner();
    if (Q.claude && Q.claude.available) {
      Q.claude.available().then(function () { /* claude:status olayını A6 yayar */ },
        function () { /* claude yok: oyun yedekle çalışır */ });
    }
    Q.bus.on('claude:status', function () {
      try { if (Q.settings && Q.settings.refreshClaudeStatus) Q.settings.refreshClaudeStatus(); } catch (e) { /* ayar kapalı */ }
    });
    sayaci();
    hosGeldin();
  }

  Q.main = { init: init, hosGeldin: hosGeldin, startStation: startStation, dogrulaIstasyon: dogrulaIstasyon, tumTamam: tumTamam };

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  }
})();

</script>
